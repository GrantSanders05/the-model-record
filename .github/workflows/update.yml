name: The Model — scheduled update

# Runs on GitHub's free tier. Public repos get unlimited Actions minutes;
# private repos get 2,000 minutes/month and a run here costs well under one
# minute, so this stays free either way.
#
# Times are UTC. 11:00 UTC is ~6am ET / 5am CT — results from last night's
# games are final, and picks are refreshed before anyone is awake to look.

on:
  schedule:
    # SUNDAY IS THE WEEK'S CLOSE. Saturday's late kickoffs are final by ~06:00 UTC,
    # so 12:00 UTC (7am CT) grades the whole weekend, refreshes the record and
    # republishes both pages before Grant looks at anything.
    - cron: "0 12 * * 0"        # Sunday morning: close the week out
    # And every other day, because locking happens on a three-day window now: a
    # Thursday night game has to be locked on Monday or Tuesday, a Saturday game on
    # Wednesday or Thursday. A weekly-only run would lock nothing in time.
    - cron: "0 11 * * *"        # daily: results, fresh grades, lock what is close
    - cron: "0 15 * * 2"        # Tuesday midday: rankings land, re-grade the week
    - cron: "0 16 * * 6"        # Saturday midday: catch grade edits before kickoffs
  workflow_dispatch:            # lets Grant trigger a run by hand from the Actions tab
    inputs:
      void_before:
        description: >-
          Void ungraded, not-yet-played picks published before this date
          (YYYY-MM-DD), then let the run re-lock the near slate. Blank = do nothing.
        required: false
        default: ""

concurrency:
  group: model-update
  cancel-in-progress: false

# Required for the GitHub Pages deploy step below.
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write                 # roster alerts are filed as issues so they email out

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Whether the college-football half of this job can run at all. Checked
      # once, here, so every dependent step reads the same answer instead of
      # each re-testing the secret and drifting.
      - name: Detect available credentials
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -n "$CFBD_API_KEY" ]; then
            echo "HAS_CFBD=true" >> "$GITHUB_ENV"
          else
            echo "HAS_CFBD=false" >> "$GITHUB_ENV"
            echo "::warning::CFBD_API_KEY is not set — college football is skipped."
          fi

      # The core is stdlib; this is only for the Sheets push. If the secret
      # isn't configured the job still runs and just skips that step.
      - name: Install Sheets dependencies
        run: pip install -r requirements.txt

      # The SQLite file and the CFBD response cache are restored between runs
      # so history never has to be re-fetched. This is what keeps the CFBD
      # spend at a handful of requests per day instead of hundreds.
      # RESTORE AND SAVE ARE SEPARATE STEPS, DELIBERATELY.
      #
      # `actions/cache` saves in a post-job step that only runs when the job
      # SUCCEEDS. That coupling cost the first two weeks of the 2026 season: a
      # crash in the research export took the job red, the post-save never ran, and
      # the database — holding freshly fetched results and freshly graded picks —
      # was discarded. The next run restored the same fortnight-old snapshot, did
      # the same work, and threw it away again. Twelve consecutive runs printed
      # "graded 8" and persisted nothing, while the half-hourly refresh job kept
      # republishing the stale bundle and staying green.
      #
      # The database is the asset; publishing is downstream of it. A publish failure
      # must never cost a result, so the save now happens with `if: always()` the
      # moment the update has written to disk, well before anything that renders.
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache
            data/model.db
            data/api_budget.json
          # The prefix is a version. Bumping it abandons the old cache and
          # rebuilds from scratch, which is the only way to discard a database
          # that has bad rows in an append-only table. v2 exists because a run
          # with an empty grades table locked 888 Elo picks into the ledger as
          # grade-model picks; run_update now refuses that, but the rows it
          # already wrote had to go.
          # v3: the link-shared sync probed for "Week 0..25 Data" and gviz serves
          # the default sheet for a name that does not exist, so one snapshot was
          # imported 26 times under invented week numbers. The grades table and
          # every pick locked from it had to go.
          key: model-data-v3-${{ github.run_id }}
          restore-keys: |
            model-data-v3-

      - name: Seed history if the cache was empty
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          # Seed on what the database CONTAINS, not on whether the file exists.
          # Those are different questions, and the difference bit: the runs that
          # failed before the key was set still cached a model.db holding NFL and
          # nothing else. Every later run then saw the file, declared itself
          # restored, and skipped the college seed forever — a poisoned cache
          # that would never have healed on its own.
          NFL=$(python3 tools/db_count.py nfl)
          CFB=$(python3 tools/db_count.py cfb)
          echo "cached: nfl=$NFL games, cfb=$CFB games"

          if [ "$NFL" -lt 100 ]; then
            echo "Seeding NFL history."
            python3 src/fetch_nfl.py
          fi

          if [ "$HAS_CFBD" = "true" ]; then
            if [ "$CFB" -lt 100 ]; then
              echo "Seeding college football history (one-off cost)."
              python3 src/fetch_cfb.py --seasons 2014-2026
            else
              echo "College football history restored from cache."
            fi
          else
            echo "::warning::CFBD_API_KEY is not set — skipping college football."
            echo "::warning::  gh secret set CFBD_API_KEY"
          fi

      # PPA backfill. fetch_ppa existed but was never called, so this table has been
      # empty in CI from the start and the efficiency view shipped blank. The seed
      # step above cannot cover it: it fires on the GAMES count, which has been
      # healthy for weeks, so a new empty table would never trigger it. Costs one
      # cached-forever request per season, and only ever runs once.
      - name: Backfill efficiency data if the table is empty
        if: ${{ env.HAS_CFBD == 'true' }}
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          PPA=$(python3 tools/db_count.py cfb team_game_stats)
          echo "cached ppa rows: $PPA"
          if [ "$PPA" -lt 100 ]; then
            echo "Backfilling PPA — the seasons' games and lines are already cached,"
            echo "so this costs one request per season for the new endpoint only."
            python3 src/fetch_cfb.py --seasons 2021-2026
          fi

      # This gate is deliberately hard: if the harness cannot prove it still
      # detects real edges and rejects noise, no picks should ship. But it
      # validates against COLLEGE games, so with no CFBD key there is nothing to
      # validate and failing here would only block the page from deploying.
      - name: Verify the harness still measures what it claims
        if: ${{ env.HAS_CFBD == 'true' }}
        run: python3 src/validate_harness.py

      # Roster news, priced in points of spread rather than reported as headlines.
      # Runs BEFORE the update so the research bundle ships this run's alerts and
      # not the previous run's. Allowed to fail: it makes 138 requests to a third
      # party, and none of that should be able to hold up the model.
      - name: Check rosters for news that moves the model
        if: ${{ env.HAS_CFBD == 'true' }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        continue-on-error: true
        run: python3 src/roster_watch.py --season 2026 --min-points 0.75

      # Alerts get their OWN cache entry, deliberately not folded into the data cache
      # above. actions/cache versions an entry by its path list, so adding one file to
      # that list invalidates every existing entry -- which is exactly what happened:
      # the next refresh found no cache, skipped, and reported success having done
      # nothing. A separate key keeps the two independent.
      - name: Save roster alerts for the refresh job
        if: ${{ env.HAS_CFBD == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: output/alerts.json
          key: model-alerts-v1-${{ github.run_id }}

      # ONLY when explicitly dispatched with a date. Nothing scheduled can reach this.
      #
      # It exists because `ledger.lock` had no window and stamped all 869 remaining
      # games on 6 August, from ratings whose quality-points term is zero and against
      # lines for games no book had priced. `INSERT OR IGNORE` made them permanent,
      # so every week of film graded afterwards was structurally unable to reach the
      # record. Those picks are a bug's output, not the model's opinion.
      #
      # The rows are marked, never deleted; anything already played is refused; and
      # `--restore` puts them back. See src/void_picks.py.
      - name: Void preseason picks (only when asked)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.void_before != '' }}
        env:
          VOID_BEFORE: ${{ inputs.void_before }}
        run: |
          python3 src/void_picks.py --sport cfb --before "$VOID_BEFORE" --apply \
            --reason "locked $VOID_BEFORE without a lock window — preseason ratings with no in-season film, against lines that did not exist yet"

      - name: Run the update
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          # Optional. With it, the grade sheet stays private and the automation
          # can write its own tabs back. Without it, MODEL_GRADES_SHEET_ID alone
          # is enough: the sync falls back to reading a link-shared sheet as CSV,
          # which needs no Google Cloud project but is public-to-anyone-with-the-ID
          # and read-only.
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          # Sheet the weekly film grades are READ FROM (the Power Rankings workbook).
          MODEL_GRADES_SHEET_ID: ${{ secrets.MODEL_GRADES_SHEET_ID }}
          # Sheet picks + accuracy are WRITTEN TO. May be the same workbook;
          # the automation only ever writes to its own tabs.
          MODEL_SHEET_ID: ${{ secrets.MODEL_SHEET_ID }}
        run: |
          if [ -n "$CFBD_API_KEY" ]; then
            python3 src/run_update.py --sport cfb --config config/cfb_grades.json
          else
            echo "::warning::Skipping the CFB update — no CFBD_API_KEY."
            # publish.py takes no arguments and writes output/site/index.html.
            # It renders from the ledger, so with no picks yet it produces an
            # honest empty record rather than nothing at all.
            python3 src/publish.py || true
          fi

      # His own bet log. Read from the same workbook, after the update so the games
      # it grades against are current. Allowed to fail: a typo in a spreadsheet must
      # never be able to stop the picks from publishing.
      - name: Read the My Bets tab
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          MODEL_GRADES_SHEET_ID: ${{ secrets.MODEL_GRADES_SHEET_ID }}
        run: |
          if [ -n "$MODEL_GRADES_SHEET_ID" ]; then
            python3 src/bet_log.py --sheet "$MODEL_GRADES_SHEET_ID"
            python3 src/research_export.py --sport cfb --out output/research/data.json
          else
            echo "::warning::MODEL_GRADES_SHEET_ID is not set — no bet log."
          fi

      # Immediately after the database is written, and before anything that can fail
      # for a cosmetic reason. `always()` so a red run still keeps its results.
      - name: Save the data cache (even if a later step fails)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache
            data/model.db
            data/api_budget.json
          key: model-data-v3-${{ github.run_id }}

      # Push, not pull. GitHub emails issue activity for free, so a material
      # injury reaches Grant without him remembering to open the site.
      - name: Raise an issue if anything material changed
        if: ${{ env.HAS_CFBD == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > alert_body.md
          import json, os
          p = "output/alerts.json"
          d = json.load(open(p)) if os.path.exists(p) else {"alerts": []}
          a = d.get("alerts", [])
          print("_%d player(s) currently listed out who move a rating by %s+ points._\n"
                % (len(a), d.get("min_points")))
          if a:
              print("| Team | Player | Pos | Line moves | Status |")
              print("|---|---|---|---:|---|")
              for r in a[:25]:
                  print("| %s | %s | %s | %.2f | %s |" % (
                      r["team"], r["player"], r["pos"], -r["points"],
                      " ".join(x for x in (r.get("status"), r.get("detail")) if x)))
          open("alert_count", "w").write(str(len(a)))
          PY
          COUNT=$(cat alert_count 2>/dev/null || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            gh issue create \
              --title "Roster news affecting the model — $(date -u +%Y-%m-%d)" \
              --body-file alert_body.md || true
          else
            echo "nothing material — no issue raised"
          fi

      # ── assemble the site ────────────────────────────────────────────────
      # The public page is generated from the append-only ledger, so it can never
      # disagree with the record it claims to show.
      #
      # THE RESEARCH BUNDLE IS PUBLISHED IN THE CLEAR, DELIBERATELY. It used to
      # ship as AES-GCM ciphertext behind a passphrase, because the film grades
      # are the model's edge and Pages cannot do Basic auth on a free account.
      # Grant reviewed the bundle's contents on 2026-09-02 and decided the grades
      # do not need protecting; there is nothing personal in it, and the barrier
      # cost him access from his own machines. So `teams[].grades` is now served
      # openly. The consequence to keep in mind: anything that IS private must be
      # kept OUT of this bundle by research_export.py, because the transport no
      # longer protects anything.
      - name: Assemble site
        run: |
          rm -rf _site && mkdir -p _site
          cp -r output/site/. _site/ 2>/dev/null || echo "no public page produced"
          if [ -f output/research/data.json ]; then
            mkdir -p _site/research
            cp site/research/index.html _site/research/index.html
            cp output/research/data.json _site/research/data.json
            echo "research app published (public)"
          else
            echo "::error::no research bundle was built"; exit 1
          fi
          find _site -type f | sed 's/^/  /'

      # Load the built pages in a real DOM and work every control. A page that
      # merely renders is not the bar -- a JS error part-way through a draw
      # leaves the previous view's markup on screen looking perfectly fine.
      # This gates the deploy: a broken site should not replace a working one.
      - name: Exercise the site in a real DOM
        run: |
          cd tools/qa && npm install --no-fund --no-audit --silent
          cd "$GITHUB_WORKSPACE"
          python3 tools/test_tracking.py
          python3 tools/test_model.py
          node tools/qa/public.mjs
          if [ -f output/research/data.json ]; then node tools/qa/research.mjs; fi
          # The populated branch of every tracking view. The live ledger is empty
          # until games are played, so without this the results and bet-log screens
          # would ship having only ever been rendered with zero rows.
          python3 tools/make_fixture.py
          QA_BUNDLE=output/research/fixture.json node tools/qa/research.mjs
          QA_PAGE=output/site/fixture.html node tools/qa/public.mjs
          rm -f output/research/fixture.json output/site/fixture.html

      - name: Upload track record page
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Publish picks as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: picks-${{ github.run_number }}
          path: output/
          retention-days: 30

  # WHY THIS EXISTS. Every scheduled update failed from 22 August to 1 September and
  # nobody found out, because the half-hourly refresh job kept succeeding and kept
  # republishing a stale bundle. The site looked alive, the Actions tab was the only
  # place the truth was written down, and nobody reads the Actions tab.
  #
  # GitHub emails issue activity for free, which is the same channel the roster
  # alerts already use. One open issue, reused rather than duplicated, so a fortnight
  # of failures is one thread and not fourteen.
  notify:
    needs: update
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="The scheduled update is failing"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number -q '.[0].number' || true)
          BODY=$(printf '%s\n' \
            "The nightly update failed on $(date -u +'%Y-%m-%d %H:%M') UTC." \
            "" \
            "**Nothing on the site is refreshing while this is red.** The half-hourly" \
            "refresh job will keep succeeding and keep republishing the last good" \
            "bundle, so the pages will look fine and will not be current." \
            "" \
            "Run: $RUN")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
